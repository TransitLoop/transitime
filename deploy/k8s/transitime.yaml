# TransitClock on the mdinamapper MicroK8s cluster.
# The client id, secret key, and database password are created separately
# and are not stored in this file. Build and deploy steps: transitime/deploy/README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: transitime-config
  namespace: mdinamapper
data:
  transitclock.properties: |
    # This file is transitclock.configFiles.
    # The client id, secret key, and database password are not stored here.
    # Kubernetes injects them as system properties from the transitime-secrets Secret.

    transitclock.core.agencyId=CHANGE_ME

    transitclock.modules.optionalModulesList=org.transitclock.custom.scania.ScaniaRfmsAVLModule

    transitclock.avl.feedPollingRateSecs=15
    transitclock.avl.feedTimeoutInMSecs=30000
    transitclock.avl.maxSpeed=50
    transitclock.avl.numThreads=1
    transitclock.avl.queueSize=2400

    transitclock.avl.scania.baseUrl=https://dataaccess.scania.com
    transitclock.avl.scania.incremental=true
    transitclock.avl.scania.dateType=received
    transitclock.avl.scania.minIntervalMillis=6000
    transitclock.avl.scania.timeoutMillis=30000
    transitclock.avl.scania.maxPages=20
    transitclock.avl.scania.vinMapFile=/etc/transitclock/scania-vin-map.properties
    transitclock.avl.scania.source=Scania

    transitclock.db.dbType=postgresql
    transitclock.db.dbName=transitclock
    transitclock.db.dbUserName=postgres
    transitclock.db.dbHost=transitime-db:5432
    transitclock.db.storeDataInDatabase=true
    transitclock.db.batchSize=4000

    transitclock.hibernate.configFile=/usr/local/transitclock/config/hibernate.cfg.xml
    transitclock.logging.dir=/usr/local/transitclock/logs
    transitclock.rmi.secondaryRmiPort=0
    transitclock.web.mapTileUrl=https://tile.openstreetmap.org/{z}/{x}/{y}.png

    transitclock.autoBlockAssigner.autoAssignerEnabled=false
    transitclock.autoBlockAssigner.ignoreAvlAssignments=false

    transitclock.core.cache.tripDataHistoryCache=org.transitclock.core.dataCache.ehcache.scheduled.TripDataHistoryCache
    transitclock.core.cache.errorCacheClass=org.transitclock.core.dataCache.ehcache.KalmanErrorCache
    transitclock.core.cache.stopArrivalDepartureCache=org.transitclock.core.dataCache.ehcache.StopArrivalDepartureCache
    transitclock.core.cache.stopPathPredictionCache=org.transitclock.core.dataCache.ehcache.dummy.DummyStopPathPredictionCache
    transitclock.core.cache.dwellTimeModelCache=org.transitclock.core.dataCache.ehcache.dummy.DummyDwellTimeModelCache
    transitclock.core.predictionGeneratorClass=org.transitclock.core.predictiongenerator.scheduled.traveltime.kalman.KalmanPredictionGeneratorImpl
    transitclock.core.dwelltime.model=org.transitclock.core.predictiongenerator.scheduled.dwell.DwellAverage
    transitclock.core.dwelltime.headwayGeneratorClass=org.transitclock.core.headwaygenerator.LastArrivalsHeadwayGenerator
  scania-vin-map.properties: |
    # VIN = GTFS vehicle_id
    # Leave this file as comments to report each vehicle under its VIN.
    # YS2R4X20002123456=1201
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: transitime-db-pvc
  namespace: mdinamapper
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: transitime-gtfs-pvc
  namespace: mdinamapper
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: transitime-db
  namespace: mdinamapper
  labels:
    app: transitime-db
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: transitime-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: transitime-db
  namespace: mdinamapper
spec:
  serviceName: transitime-db
  replicas: 1
  selector:
    matchLabels:
      app: transitime-db
  template:
    metadata:
      labels:
        app: transitime-db
    spec:
      containers:
        - name: postgres
          image: postgres:14
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: transitime-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: transitime-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: transitime-secrets
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$(POSTGRES_USER)" -d "$(POSTGRES_DB)"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$(POSTGRES_USER)" -d "$(POSTGRES_DB)"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: transitime-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: transitime
  namespace: mdinamapper
  labels:
    app: transitime
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: transitime
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transitime
  namespace: mdinamapper
  labels:
    app: transitime
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: transitime
  template:
    metadata:
      labels:
        app: transitime
    spec:
      imagePullSecrets:
        - name: docker-registry-secret
      containers:
        - name: transitime
          image: transitloop/transitime:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: TRANSITCLOCK_CONFIG_FILES
              value: /etc/transitclock/transitclock.properties
            - name: SCANIA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: transitime-secrets
                  key: SCANIA_CLIENT_ID
            - name: SCANIA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: transitime-secrets
                  key: SCANIA_SECRET_KEY
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: transitime-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: transitime-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: transitime-secrets
                  key: POSTGRES_DB
            - name: USER_TIMEZONE
              value: Africa/Casablanca
            - name: CORE_XMX
              value: 1536m
          volumeMounts:
            - name: config
              mountPath: /etc/transitclock
              readOnly: true
            - name: gtfs
              mountPath: /data/gtfs
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: config
          configMap:
            name: transitime-config
        - name: gtfs
          persistentVolumeClaim:
            claimName: transitime-gtfs-pvc
